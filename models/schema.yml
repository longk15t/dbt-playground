
version: 2

sources:
  - name: jaffle_shop
    database: raw
    schema: jaffle_shop
    config:
      freshness:
        warn_after:
          count: 3
          period: day
        error_after:
          count: 7
          period: day
        loaded_at_field: _etl_loaded_at
    tables:
      - name: customers
        columns:
          - name: id
            data_tests:
              - unique
              - not_null
              
      - name: orders
        columns:
          - name: id
            data_tests:
              - unique
              - not_null

  - name: stripe
    database: raw
    config:
      freshness:
        warn_after:
          count: 3
          period: day
        error_after:
          count: 10
          period: day
        loaded_at_field: _etl_loaded_at
    tables:
      - name: payment

models:
  - name: stg_jaffle_shop__orders
    description: "Test cases for staging model stg_jaffle_shop__orders"
    columns:
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['completed', 'returned', 'return_pending', 'shipped', 'placed']
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_jaffle_shop__customers')
                field: customer_id
  - name: dim_customers
    description: "Jaffle Shop customer final model"
    columns:
      - name: customer_id
        description: "The primary key for this table"
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: "First name of customer must not be null"
        data_tests:
          - not_null
      - name: last_name
        description: "Last name of customer must not be null"
        data_tests:
          - not_null
      - name: number_of_orders
        description: "Number of order should be not null"
        data_tests:
          - not_null

  - name: fct_orders
    description: "Fact orders of Jaffle Shop"
    columns:
      - name: order_id
        description: "The order id"
        data_tests:
          - not_null

      - name: customer_id
        description: "Customer id should not be null"
        data_tests:
          - not_null

      - name: amount
        description: "Amount should not be null"
        data_tests:
          - not_null
