
version: 2

models:
    - name: dim_customers
      description: "Jaffle Shop customer final model"
      columns:
          - name: customer_id
            description: "The primary key for this table"
            tests:
                - unique
                - not_null

          - name: first_name
            description: "First name of customer must not be null"
            tests:
                - not_null

          - name: last_name
            description: "Last name of customer must not be null"
            tests:
                - not_null

          - name: number_of_orders
            description: "Number of order should be not null"
            tests:
                - not_null
